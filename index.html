<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="KhimVentions" />
  <title>KhimVentions</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <style>
    :root {
      --bg:#0f1115; --card:#1d212b; --line:#2a2f3a; --text:#eef1f6; --text-dim:#9aa3b2;
      --accent:#7c9cff; --accent-2:#b48cff; --radius:18px;
      --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; min-height:100vh; background:radial-gradient(120% 80% at 50% 0%, #181c26 0%, var(--bg) 60%);
      color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
      font-size:17px; line-height:1.4; -webkit-user-select:none; user-select:none; }
    .wrap { max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;
      justify-content:center; gap:18px; padding:calc(24px + var(--safe-top)) 20px calc(28px + var(--safe-bottom)); }
    .hello { text-align:center; }
    .hello h1 { font-size:30px; font-weight:900; letter-spacing:-0.5px; margin:0 0 4px; }
    .hello p { color:var(--text-dim); margin:0; }
    .cards { display:flex; flex-direction:column; gap:14px; }
    .launch {
      display:flex; align-items:center; gap:16px; text-decoration:none; color:var(--text);
      background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
      padding:20px; transition:transform .08s, border-color .15s; cursor:pointer;
    }
    .launch:active { transform:scale(.97); }
    .launch.game { border-color:var(--accent-2); background:linear-gradient(180deg,#231f2e,var(--card)); }
    .ico { font-size:46px; flex:0 0 auto; }
    .meta { flex:1; min-width:0; }
    .meta .name { font-size:20px; font-weight:800; }
    .meta .sub { color:var(--text-dim); font-size:14px; margin-top:3px; }
    .chev { color:var(--text-dim); font-size:24px; }
    .foot { text-align:center; color:var(--text-dim); font-size:13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hello">
      <h1>KhimVentions</h1>
      <p>Pick where you're headed.</p>
    </div>
    <div class="cards">
      <a class="launch" href="tracker.html">
        <span class="ico">🧠</span>
        <span class="meta">
          <span class="name">The Tracker</span>
          <span class="sub">Habits, meds, to-dos, people — your everything, one tap to log.</span>
        </span>
        <span class="chev">→</span>
      </a>
      <a class="launch game" href="game.html">
        <span class="ico">🎲</span>
        <span class="meta">
          <span class="name">KhimVentures</span>
          <span class="sub">A pocket dice roguelite. Roll the dice, brave the den.</span>
        </span>
        <span class="chev">→</span>
      </a>
    </div>
    <p class="foot">Both live on this device · no login · nothing to break.</p>
  </div>

  <script>
    // keep the tracker's offline/PWA powers working from the launcher too
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
